databases:
  - name: mmg-autozone-db
    plan: free # Upgrade to starter ($7/mo) for persistent data
    databaseName: mmg_autozone
    user: autozone_user

services:
  - type: web
    name: mmg-autozone-app
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      # ── App ──────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: "MMG Autozone"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://mmg-autozone-app.onrender.com

      # ── Database (auto-linked from Render Postgres) ────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mmg-autozone-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mmg-autozone-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mmg-autozone-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mmg-autozone-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mmg-autozone-db
          property: password

      # ── Cache / Session / Queue ──────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: cloudinary

      # ── Mail (Resend) ────────────────────────────────────────────────────
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: noreply@mmgautozone.com
      - key: MAIL_FROM_NAME
        value: "MMG Autozone"
      - key: RESEND_API_KEY
        sync: false   # Set manually in Render Dashboard > Environment

      # ── Cloudinary ────────────────────────────────────────────────────────
      - key: CLOUDINARY_URL
        sync: false   # Set manually in Render Dashboard > Environment
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
